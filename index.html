<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destino Brotas - Aventura e Tranquilidade</title>
    <!-- CSS do Bootstrap 5 (https://getbootstrap.com/) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Seu arquivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <!-- Container principal centralizado no tamanho de computador -->
    <div class="pagina-computador mx-auto">
 
        <!-- ================= SEÇÃO 1: BANNER / HEADER ================= -->
        <header id="home" class="hero-section position-relative">
            <!-- Imagem de fundo do banner colocada no HTML -->
            <img src="./img/floresta.jpg" alt="Fundo Floresta e Passarela Brotas" class="hero-bg-img">
            
            <!-- Camada escura sobre a imagem para dar leitura ao texto -->
            <div class="hero-overlay"></div>
 
            <!-- Barra Superior: Logo GPS e Menu de Quadradinhos -->
            <nav class="navbar navbar-expand-lg pt-3 px-4 position-relative z-2">
                <div class="container-fluid">
                    <!-- Logo GPS (Destino Brotas) em formato <img> -->
                    <a class="navbar-brand p-0" href="#home">
                        <img src="./img/gps.png" alt="Logo Destino Brotas" class="logo-gps">
                    </a>
 
                    <!-- Botões do menu (quadradinhos) posicionados à direita -->
                    <div class="ms-auto menu-quadradinhos d-flex gap-3">
                        <a href="#home" class="btn-quadrado active">Home</a>
                        <a href="#passeios" class="btn-quadrado">Passeios</a>
                        <a href="#precos" class="btn-quadrado">Preços</a>
                        <a href="#contato" class="btn-quadrado">Contato</a>
                    </div>
                </div>
            </nav>
 
            <!-- Texto Central e Botões VIDEO / LEIA MAIS -->
            <div class="hero-content text-center position-relative z-2 d-flex flex-column justify-content-center align-items-center">
                <h1 class="titulo-principal mb-4">AVENTURA E TRANQUILIDADE</h1>
                <div class="d-flex justify-content-center gap-5 mt-2">
                    <a href="#video" class="btn-hero-quadrado">VIDEO</a>
                    <a href="#passeios" class="btn-hero-quadrado">LEIA MAIS</a>
                </div>
            </div>
        </header>
 
        <!-- ================= SEÇÃO 2: PASSEIOS ================= -->
        <section id="passeios" class="secao-passeios py-4 px-4">
            <h2 class="titulo-secao mb-4">Passeios</h2>
            
            <div class="container">
                <div class="row justify-content-center g-5">
                    
                    <!-- Card 1: Canoagem -->
                    <div class="col-md-4 d-flex justify-content-center">
                        <div class="card-passeio">
                            <img src="./img/canoa.jpg" alt="Canoagem" class="img-passeio">
                            <div class="legenda-passeio">Canoagem</div>
                        </div>
                    </div>
 
                    <!-- Card 2: Passeio Radical -->
                    <div class="col-md-4 d-flex justify-content-center">
                        <div class="card-passeio">
                            <img src="./img/passeio radical.jpg" alt="Passeio Radical" class="img-passeio">
                            <div class="legenda-passeio">Passeio Radical</div>
                        </div>
                    </div>
 
                    <!-- Card 3: Trilhas -->
                    <div class="col-md-4 d-flex justify-content-center">
                        <div class="card-passeio">
                            <img src="./img/trilha.jpg" alt="Trilhas" class="img-passeio">
                            <div class="legenda-passeio">Trilhas</div>
                        </div>
                    </div>
 
                </div>
            </div>
        </section>
 
        <!-- ================= SEÇÃO 3: VALORES ================= -->
        <section id="precos" class="secao-valores py-4 px-4">
            <h2 class="titulo-secao mb-4">Valores</h2>
 
            <div class="container d-flex justify-content-center my-4">
                <table class="tabela-valores text-center">
                    <thead>
                        <tr>
                            <th>Passeios</th>
                            <th>Valores</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Canoagem</td>
                            <td>R$ 60,00</td>
                        </tr>
                        <tr>
                            <td>Passeio Radical</td>
                            <td>R$ 80,00</td>
                        </tr>
                        <tr>
                            <td>Trilhas</td>
                            <td>R$ 90,00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2" class="rodape-tabela">
                                Consulte na recepção os valores atualizados
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
 
        <!-- ================= SEÇÃO 4: RODAPÉ / CONTATO ================= -->
        <footer id="contato" class="secao-rodape d-flex justify-content-center align-items-center">
            <div class="d-flex align-items-center gap-3">
                <!-- Ícone do WhatsApp em formato <img> -->
                <img src="./img/whatsapp.png" alt="WhatsApp" class="icone-whatsapp">
                <span class="texto-contato">Contato: (19) 992124943</span>
            </div>
        </footer>
 
    </div>
 
    <!-- JavaScript do Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 </body>
</html>
